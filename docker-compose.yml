services:

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.1
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - DOCS_PATH=/app/docs
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RERANKER=true
    volumes:
      - ./backend/docs:/app/docs
    depends_on:
      - chroma
      - ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    ports:
      - "8081:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://rag-backend:8088/v1
      - OPENAI_API_KEYS=dummy
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    depends_on:
      - backend
      - ollama
    restart: unless-stopped
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  ollama_data:
  openwebui_data:
